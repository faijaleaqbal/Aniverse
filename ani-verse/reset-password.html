<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password | AniFlick</title>
  <meta name="description" content="Set a new password for your AniFlick account.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/zoro-aizen.css?v=23">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 1rem;
      box-sizing: border-box;
    }
    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      background: rgba(22, 24, 32, 0.92);
      border: 1px solid #2a2e3a;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(202, 233, 98, 0.15);
    }
    .reset-logo { text-align: center; margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 800; }
    .reset-logo span { color: #cae962; }
    .reset-card h1 { margin: 0 0 0.5rem; font-size: 1.25rem; text-align: center; }
    .reset-card p.lead { margin: 0 0 1.5rem; color: #9ca3af; font-size: 0.9rem; line-height: 1.5; text-align: center; }
    .reset-msg {
      display: none;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .reset-msg.error { background: rgba(255,80,80,0.15); border: 1px solid #ff5050; color: #ff8080; }
    .reset-msg.success { background: rgba(202,233,98,0.12); border: 1px solid #cae962; color: #d9f99d; }
    .reset-back { display: block; text-align: center; margin-top: 1.25rem; color: #cae962; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="reset-card">
    <p class="reset-logo">Ani<span>Flick</span></p>
    <h1>Set a new password</h1>
    <p class="lead">Choose a new password for your account (at least 8 characters).</p>
    <div id="reset-msg" class="reset-msg" role="alert"></div>
    <form id="reset-form">
      <div class="input-field-group">
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
      </div>
      <div class="input-field-group">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" placeholder="Repeat the new password" autocomplete="new-password" required>
      </div>
      <button class="btn-zoro-primary" id="btn-reset-submit" type="submit" style="width: 100%; justify-content: center; padding: 0.75rem;">Set new password</button>
    </form>
    <a class="reset-back" href="/">Back to AniFlick</a>
  </div>
  <script src="js/reset-password.js?v=1"></script>
</body>
</html>
