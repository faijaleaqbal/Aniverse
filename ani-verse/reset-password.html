<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The reset token is in this page's URL: never send a Referer anywhere. -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password | AniFlick</title>
  <meta name="description" content="Set a new password for your AniFlick account.">
  <!-- No external requests on this page (no fonts, no analytics): the token
       in the URL must never leak to a third party via Referer. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/zoro-aizen.css?v=22">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 1rem;
      box-sizing: border-box;
    }
    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      background: rgba(22, 24, 32, 0.92);
      border: 1px solid #2a2e3a;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(202, 233, 98, 0.15);
    }
    .reset-logo { text-align: center; margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 800; }
    .reset-logo span { color: #cae962; }
    .reset-card h1 { margin: 0 0 0.5rem; font-size: 1.25rem; text-align: center; }
    .reset-card p.lead { margin: 0 0 1.5rem; color: #9ca3af; font-size: 0.9rem; line-height: 1.5; text-align: center; }
    .reset-msg {
      display: none;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .reset-msg.error { background: rgba(255,80,80,0.15); border: 1px solid #ff5050; color: #ff8080; }
    .reset-msg.success { background: rgba(202,233,98,0.12); border: 1px solid #cae962; color: #d9f99d; }
    .reset-back { display: block; text-align: center; margin-top: 1.25rem; color: #cae962; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="reset-card">
    <p class="reset-logo">Ani<span>Flick</span></p>
    <h1>Set a new password</h1>
    <p class="lead">Choose a new password for your account (at least 8 characters).</p>
    <div id="reset-msg" class="reset-msg" role="alert"></div>
    <form id="reset-form">
      <div class="input-field-group">
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
      </div>
      <div class="input-field-group">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" placeholder="Repeat the new password" autocomplete="new-password" required>
      </div>
      <button class="btn-zoro-primary" id="btn-reset-submit" type="submit" style="width: 100%; justify-content: center; padding: 0.75rem;">Set new password</button>
    </form>
    <a class="reset-back" href="/">Back to AniFlick</a>
  </div>
  <script>
    (function () {
      var msg = document.getElementById("reset-msg");
      var form = document.getElementById("reset-form");
      var submitBtn = document.getElementById("btn-reset-submit");
      var token = new URLSearchParams(window.location.search).get("token") || "";

      function showMsg(text, kind) {
        msg.textContent = text;
        msg.className = "reset-msg " + kind;
        msg.style.display = "block";
      }

      if (!token) {
        form.style.display = "none";
        showMsg("This password link is invalid or has expired.", "error");
        return;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        msg.style.display = "none";
        var pw = document.getElementById("new-password").value;
        var confirm = document.getElementById("confirm-password").value;
        if (pw.length < 8 || pw.length > 200) {
          showMsg("Password must be between 8 and 200 characters.", "error");
          return;
        }
        if (pw !== confirm) {
          showMsg("The two passwords don't match.", "error");
          return;
        }
        submitBtn.disabled = true;
        var res;
        try {
          res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ token: token, newPassword: pw }),
          });
        } catch (err) {
          submitBtn.disabled = false;
          showMsg("Something went wrong. Please try again.", "error");
          return;
        }
        submitBtn.disabled = false;
        var data = await res.json().catch(function () { return null; });
        if (res.ok && data && data.ok) {
          form.style.display = "none";
          showMsg("Your password has been set. You can now sign in.", "success");
        } else {
          /* One generic failure for every token problem — the server never
             distinguishes unknown / expired / already-used. */
          showMsg(
            (data && data.error && data.error.message) || "This password link is invalid or has expired.",
            "error"
          );
        }
      });
    })();
  </script>
</body>
</html>
